name: CI & SonarCloud Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-test-analyze:
    name: Build, Test & SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Desactiva shallow clone para análisis histórico de SonarCloud

      - name: Setup Runtime Environment
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python scripts/install_deps.py

      - name: Verify Cyclomatic Complexity Limits (CC <= 5)
        run: |
          echo "Verificando límites deterministas de complejidad ciclomática (CC <= 5)..."
          python -m radon cc domain ports core adapters bootstrap.py main.py -s -a -n B

      - name: Verify Maintainability Index (Radon Rank A)
        run: |
          echo "Verificando Maintainability Index de Radon (Rank A)..."
          python -m radon mi domain ports core adapters bootstrap.py main.py -s

      - name: Execute Unit Tests with Coverage Report
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Verification
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
