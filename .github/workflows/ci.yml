name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Checks
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest radon anyio

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Cyclomatic Complexity (Radon Rank A)
        run: |
          python -m radon cc domain ports core adapters main.py -s -a

      - name: Verify Maintainability Index (Radon Rank A)
        run: |
          python -m radon mi domain ports core adapters main.py -s
