<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YT Global DL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-group">
        <div class="logo-badge">DL</div>
        <div>
          <h1 class="title">YT Global DL</h1>
          <p class="subtitle">Hexagonal Clean Downloader</p>
        </div>
      </div>
      <div id="status-pill" class="status-pill offline">
        <span class="status-dot"></span>
        <span id="status-text">Connecting</span>
      </div>
    </header>

    <main class="content">
      <div class="input-card">
        <label for="url-input" class="label">Media URL or Video ID</label>
        <div class="input-row">
          <input type="text" id="url-input" placeholder="https://youtube.com/watch?v=..." />
          <button id="btn-paste" class="btn-icon" title="Paste from clipboard">📋</button>
        </div>

        <div class="actions-grid">
          <button id="btn-download-video" class="btn btn-primary">
            <span>🎬</span> Video (1080p+)
          </button>
          <button id="btn-download-audio" class="btn btn-secondary">
            <span>🎧</span> Audio (MP3)
          </button>
        </div>
      </div>

      <div class="section-header">
        <h2>Active Pipeline Jobs</h2>
        <button id="btn-refresh" class="btn-text">Refresh</button>
      </div>

      <div id="jobs-list" class="jobs-list">
        <div class="empty-state">No active downloads</div>
      </div>
    </main>

    <footer class="footer">
      <span>Files saved to: <code>Downloads/yt-global-dl</code></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
