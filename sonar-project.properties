# Configuración Canónica de SonarCloud para yt-global-dl (OffStream)
sonar.projectKey=ismaelUML_OffStream
sonar.organization=ismaeluml
sonar.host.url=https://sonarcloud.io

# Directorios de fuentes y pruebas unitarias
sonar.sources=domain,ports,core,adapters,bootstrap.py,main.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusiones de artefactos externos y clientes auxiliares
sonar.exclusions=**/tests/**,**/clients/**,**/scripts/**,**/*.vbs,**/*.bat
sonar.coverage.exclusions=**/main.py,**/adapters/in_bound/gui.py,**/scripts/**,**/clients/**

# Reporte de cobertura unitaria generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
